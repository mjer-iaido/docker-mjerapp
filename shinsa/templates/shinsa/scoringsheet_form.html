{% extends "base.html" %}
{% load utils %}

{% block body %}
<!-- Content Header (Page header) -->
    <div class="content-header">
        <h3>昇段審査　受審者</h3>
        <h2>
            {{ scoringsheet.testee }}
        </h2>
    </div>
    <form method="POST">{% csrf_token %}
        <table width="50%" class="table table-striped table-bordered table-hover">
            <tr>
                <th width="25%">
                    <h3>Title</h3>
                </th>
                <th width="">
                    <h3>Form</h3>
                </th>
            </tr>
            {{ form.as_p }}
        </table>
        {% comment %} {{ form.as_p }} {% endcomment %}
        <button class="btn btn-primary" type="submit">送信</button>
        <input type="button" value="戻る" onClick="javascript:history.go(-1);">
    </form>

{% endblock %}
{% block extrajs %}
    <script>

        const parentCategoryElement = $('#id_parent_category');
        const categoryElement = $('#id_category');
        const categories = {
            {% for parent in parentcategory_list %}
                '{{ parent.pk }}': [
                    {% for category in parent.category_set.all %}
                        {
                            'pk': '{{ category.pk }}',
                            'name': '{{ category.name }}'
                        },
                    {% endfor %}
                ],
            {% endfor %}
        };


        const changeCategory = (select) => {
            // 子カテゴリの選択欄を空にする。
            categoryElement.children().remove();

            // 選択した親カテゴリに紐づく子カテゴリの一覧を取得する。
            const parentId = parentCategoryElement.val();
            const categoryList = categories[parentId];

            // 子カテゴリの選択肢を作成・追加。
            for (const category of categoryList) {
                const option = $('<option>');
                option.val(category['pk']);
                option.text(category['name']);
                categoryElement.append(option);
            }

            // 指定があれば、そのカテゴリを選択する
            if (select !== undefined) {
                categoryElement.val(select);
            }
        };


        $('#id_parent_category').on('change', () => {
            changeCategory();
        });


        // 入力値に問題があって再表示された場合、ページ表示時点で小カテゴリが絞り込まれるようにする
        if (parentCategoryElement.val()) {
            const selectedCategory = categoryElement.val();
            changeCategory(selectedCategory);
        }

    </script>
        <script>
        (function($){
            $(function(){
                const select = $('#id_testee');
                if (!select.length) return; // no testee field on this form

                // store original options so we can restore
                const originalOptions = select.find('option').map(function(){
                    return {value: $(this).val(), text: $(this).text(), selected: $(this).is(':selected')};
                }).get();

                // insert search input above the select
                const $search = $('<input>',{
                    id: 'testee-search',
                    type: 'search',
                    placeholder: '名前で検索（日本語/英語）',
                    class: 'form-control',
                    style: 'margin-bottom:8px; width:50%;'
                });
                select.before($search);

                const url = "{% url 'ajax_testee_search' %}";

                let timer = null;
                $search.on('input', function(){
                    const q = $(this).val().trim();
                    clearTimeout(timer);
                    timer = setTimeout(function(){
                        if (q === ''){
                            // restore original options
                            select.empty();
                            originalOptions.forEach(function(o){
                                const opt = $('<option>').val(o.value).text(o.text);
                                if (o.selected) opt.prop('selected', true);
                                select.append(opt);
                            });
                            return;
                        }

                        // fetch matches
                        $.getJSON(url, {q: q}).done(function(data){
                            select.empty();
                            if (!data || data.length === 0){
                                // no hits: leave empty and optionally show a placeholder
                                select.append($('<option>').text('該当なし').val(''));
                                return;
                            }

                            const currentVal = select.val();
                            data.forEach(function(item){
                                const opt = $('<option>').val(item.id).text(item.label);
                                if (String(item.id) === String(currentVal)) opt.prop('selected', true);
                                select.append(opt);
                            });
                        }).fail(function(){
                            // on error, do nothing (keep current list)
                        });
                    }, 300);
                });

            });
        })(jQuery);
    </script>
{% endblock %}
